# Chaine d'integration continue CrisisShield — equivalent GitHub Actions de .gitlab-ci.yml (EP01-US05)
# Quatre etapes : construire, tester, controler la securite, publier l'image.
# Les controles bloquants le sont des le premier jour ; Semgrep passe en bloquant une fois le bruit trie.
name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:

  backend:
    name: Backend — construction et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: "Tests (44 tests : jetons, isolation, assistant)"
        working-directory: backend
        run: mvn -B --no-transfer-progress test
      - name: Construction du jar
        working-directory: backend
        run: mvn -B --no-transfer-progress -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  frontend:
    name: Front — typage et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Controle de typage
        working-directory: frontend
        run: npm run typecheck
      - name: Construction
        working-directory: frontend
        run: npm run build

  secrets:
    name: Securite — secrets (Gitleaks, bloquant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tout l'historique : un secret retire hier est encore dans Git
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Securite — dependances et configuration (Trivy, bloquant sur critique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Failles critiques
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Failles elevees (information seulement)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH
          exit-code: "0"

  sast:
    name: Securite — analyse statique (Semgrep, non bloquant pour l'instant)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    continue-on-error: true      # EP19-US03 : passer en bloquant une fois les faux positifs classes
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/owasp-top-ten --config p/java --config p/typescript --config .semgrep.yml --error

  sbom:
    name: Securite — nomenclature logicielle (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: backend
          format: cyclonedx-json
          artifact-name: sbom-backend.cdx.json

  image:
    name: Image — construction et publication (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets, dependencies]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquette = empreinte de commit, jamais latest (EP01-US06)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Analyse de l'image publiee
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
