# Configuration de la base de données H2 pour les tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA pour H2
# Sous H2 le schema est genere par Hibernate ; les migrations Flyway sont ecrites pour PostgreSQL.
# Les tests contre un vrai PostgreSQL (Testcontainers) arrivent au lot 4 (TP13).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Désactive le CommandLineRunner pour les tests
spring.main.web-application-type=none
