spring.application.name=crisisshield

# JWT — RS256 (EP02-US06). Sans chemins de cle : paire generee au demarrage (developpement).
# Production : cles PEM (PKCS#8 / X.509) montees depuis Secrets Manager ou signature deleguee a KMS (EP09).
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
jwt.expiration=${JWT_EXPIRATION:900000}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crisisshield_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:crisisshield_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:crisisshield_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

# Amorcage des comptes de developpement (DevDataInitializer)
app.dev-data.enabled=${APP_DEV_DATA_ENABLED:false}

# Assistant IA (EP18) : "mock" tant qu'aucun fournisseur reel n'est branche
app.assistant.provider=${APP_ASSISTANT_PROVIDER:mock}
app.assistant.max-prompt-chars=${APP_ASSISTANT_MAX_PROMPT_CHARS:4000}
app.assistant.rate-limit.capacity=${APP_ASSISTANT_RATE_CAPACITY:20}
app.assistant.rate-limit.refill-per-minute=${APP_ASSISTANT_RATE_REFILL:20}

# Identifiant de correlation dans chaque ligne de journal (EP10-US05)
logging.pattern.level=%5p [%X{correlationId:-}]

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Les proprietes LDAP vivent dans application-ldap.yml (prefixe app.ldap.*)
